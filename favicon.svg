    <!-- Pills -->
    <rect x="29" y="25" width="10" height="50" rx="5" />
    <rect x="46" y="10" width="10" height="80" rx="5" />
    <rect x="63" y="25" width="10" height="50" rx="5" />
    <rect x="79" y="35" width="8" height="30" rx="4" />
